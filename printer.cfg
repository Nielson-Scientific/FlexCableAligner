# This is a backup of the printer configuration file for Klipper.

[include fluidd.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_2D001D000751303532383235-if00

[virtual_sdcard]
path: /home/nielson-scientific/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# Driver 0: X
[stepper stepper_x]
carriages: x
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 4.82

[carriage x]
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 0
position_max: 200
homing_speed: 5.0

[tmc2209 stepper stepper_x]
diag_pin: ^PG6
driver_SGTHRS: 40
uart_pin: PC4
run_current: 0.9
hold_current: 0.4

[force_move]
enable_force_move: true

# Driver1: Y
[stepper stepper_y]
carriages: y
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 2

[carriage y]
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 0.5
position_max: 100
homing_speed: 5.0

[tmc2209 stepper stepper_y]
diag_pin: ^PG9
driver_SGTHRS: 100
uart_pin: PD11
run_current: 0.9
hold_current: 0.4

# # Driver2: Z
[stepper stepper_z]
carriages: z
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8

[carriage z]
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_min: 0
position_endstop: 0
position_max: 50
homing_speed: 5.0

[tmc2209 stepper stepper_z]
diag_pin: ^PG10
driver_SGTHRS: 100
uart_pin: PC6
run_current: 0.9
hold_current: 0.4

# # X2, corresponding to Driver3
[stepper stepper_x2]
carriages: x2
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 4.82

[dual_carriage x2]
primary_carriage: x
safe_distance: 10
endstop_pin: tmc2209_stepper_x2:virtual_endstop
position_min: 0
position_endstop: 200
position_max: 200
homing_speed: 5.0


[tmc2209 stepper stepper_x2]
diag_pin: ^PG11
driver_SGTHRS: 40
uart_pin: PC7
run_current: 0.9
hold_current: 0.4


# Y2, corresponding to Driver4
[stepper stepper_y2]
carriages: y2
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 2

[dual_carriage y2]
primary_carriage: y
safe_distance: 0
endstop_pin: tmc2209_stepper_y2:virtual_endstop
position_min: 0
position_endstop: 0
position_max: 100
homing_speed: 5.0

[tmc2209 stepper stepper_y2]
diag_pin: ^PG12
driver_SGTHRS: 100
uart_pin: PF2
run_current: 1.2
hold_current: 0.4

