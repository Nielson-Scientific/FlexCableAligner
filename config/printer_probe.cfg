[include fluidd.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_4F0025000651313031393839-if00

[virtual_sdcard]
path: /home/aligner/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: none
max_velocity: 1000
max_accel: 1000

# Driver 0: X
[stepper stepper_x]
carriages: x
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 10

[carriage x]
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 0
position_max: 1000
homing_speed: 45.0

[tmc2209 stepper stepper_x]
diag_pin: ^PG6
driver_SGTHRS: 60
uart_pin: PC4
run_current: 0.8
hold_current: 0.4

# Driver1: Y
[stepper stepper_y]
carriages: y
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 20

[carriage y]
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 0.5
position_max: 200
homing_speed: 45.0

[tmc2209 stepper stepper_y]
diag_pin: ^PG9
driver_SGTHRS: 65
uart_pin: PD11
run_current: 0.9
hold_current: 0.4

# # Driver2: Z
[stepper stepper_z]
carriages: z
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 0.8

[carriage z]
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_min: 0
position_endstop: 0.5
homing_retract_dist: 5
position_max: 50

[tmc2209 stepper stepper_z]
diag_pin: ^PG10
driver_SGTHRS: 150
uart_pin: PC6
run_current: 0.9
hold_current: 0.4

[printer]
kinematics: generic_cartesian
max_velocity: 100
max_accel: 500
max_z_velocity: 5
max_z_accel: 100

[force_move]
enable_force_move: True

# # X2, corresponding to Driver4
[stepper stepper_x2]
carriages: x2
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 10

[dual_carriage x2]
primary_carriage: x
safe_distance: 10
endstop_pin: tmc2209_stepper_x2:virtual_endstop
position_min: 0
position_endstop: 1000
position_max: 1000
homing_speed: 45.0


[tmc2209 stepper stepper_x2]
diag_pin: ^PG12
driver_SGTHRS: 100
uart_pin: PF2
run_current: 0.9
hold_current: 0.4


# Y2, corresponding to Driver5
[stepper stepper_y2]
carriages: y2
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 20

[dual_carriage y2]
primary_carriage: y
safe_distance: 0
endstop_pin: tmc2209_stepper_y2:virtual_endstop
position_min: 0
position_endstop: 0
position_max: 200
homing_speed: 45.0

[tmc2209 stepper stepper_y2]
diag_pin: ^PG13
driver_SGTHRS: 65
uart_pin: PE4
run_current: 0.9
hold_current: 0.4

